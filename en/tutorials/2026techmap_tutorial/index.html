<!doctype html><html lang="en" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/2026TechMap_tutorial/en/favicon.ico"><link rel="mask-icon" href="/2026TechMap_tutorial/en/favicon.svg" color="#333333"><title>Documentation</title><script>var baseUrl = "/2026TechMap_tutorial/en/"</script><script defer="defer" src="/2026TechMap_tutorial/en/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/2026TechMap_tutorial/en/js/index.f7bc5188.js"></script><link href="/2026TechMap_tutorial/en/css/index.63be42cf.css" rel="stylesheet"></head><body data-color-scheme="auto"><template id="custom-header"><style>
  :host { display:block; }
  .language-bar { display:flex; justify-content:flex-end; align-items:center; gap:8px; max-width:980px; margin:auto; padding:8px 24px; font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif; }
  .language-bar a { display:inline-block; color:#0066cc; padding:4px 12px; border:1px solid #aaa; border-radius:6px; text-decoration:none; }
  .language-bar a[aria-current="page"] { background:#0066cc; border-color:#0066cc; color:#fff; }
  .language-bar a:focus-visible { outline:3px solid #007aff; outline-offset:3px; }
  :host([data-color-scheme="dark"]) .language-bar a:not([aria-current]) { color:#6bb8ff; border-color:#777; }
  @media(prefers-color-scheme:dark) { :host([data-color-scheme="auto"]) .language-bar a:not([aria-current]) { color:#6bb8ff; border-color:#777; } }
</style>
<nav class="language-bar" aria-label="Documentation language">
  <a id="language-ko" href="/2026TechMap_tutorial/tutorials/2026techmap_tutorial" lang="ko" hreflang="ko">한국어</a>
  <a id="language-en" href="/2026TechMap_tutorial/en/tutorials/2026techmap_tutorial" lang="en" hreflang="en">English</a>
</nav>
<script>
(() => {
  const pageBase = (window.baseUrl || '/').replace(/\/?$/, '/');
  const isEnglish = /\/en\/$/.test(pageBase);
  const locale = isEnglish ? 'en' : 'ko';
  const rootBase = isEnglish ? pageBase.slice(0, -3) : pageBase;
  const firstLine = isEnglish ? 'Build an Immersive Space' : '구름 위를 둥둥 떠다니는';
  const secondLine = isEnglish ? 'Above the Clouds' : 'Immersive Space 만들기';
  let languageMap;
  fetch(`${rootBase}language-map.json`).then(response => {
    if (!response.ok) throw new Error('Language map unavailable');
    return response.json();
  }).then(value => { languageMap = value; updateLanguageLinks(); }).catch(() => {});
  const updateLanguageLinks = () => {
    const header = document.querySelector('custom-header');
    const shadow = header && header.shadowRoot;
    if (!shadow) return;
    document.documentElement.lang = locale;
    let path = window.location.pathname;
    path = path.startsWith(pageBase) ? '/' + path.slice(pageBase.length) : '/tutorials/2026techmap_tutorial';
    path = path.replace(/\/index\.html$/, '').replace(/\/$/, '');
    if (!path || path === '/index.html') path = '/tutorials/2026techmap_tutorial';
    const pair = languageMap && languageMap.pages[path];
    for (const targetLocale of ['ko', 'en']) {
      const link = shadow.getElementById(`language-${targetLocale}`);
      if (!link) continue;
      const targetBase = targetLocale === 'en' ? `${rootBase}en/` : rootBase;
      let hash = window.location.hash;
      if (hash && targetLocale !== locale) {
        let decoded;
        try { decoded = decodeURIComponent(hash.slice(1)); } catch { decoded = hash.slice(1); }
        const index = pair ? pair[locale].findIndex(anchor => decodeURIComponent(anchor) === decoded) : -1;
        hash = index >= 0 ? '#' + encodeURIComponent(decodeURIComponent(pair[targetLocale][index])) : '';
      }
      const href = `${targetBase}${path.slice(1)}${hash}`;
      if (link.getAttribute('href') !== href) link.setAttribute('href', href);
      if (targetLocale === locale) {
        if (!link.hasAttribute('aria-current')) link.setAttribute('aria-current', 'page');
      } else if (link.hasAttribute('aria-current')) link.removeAttribute('aria-current');
    }
  };
  const formatTitle = () => {
    const title = document.querySelector('.hero h1.title');
    if (!title) return;
    const normalizedTitle = title.textContent.replace(/\s+/g, '');
    if (normalizedTitle !== `${firstLine}${secondLine}`.replace(/\s+/g, '')) return;

    const hero = title.closest('.hero');
    if (!hero.dataset.cloudBackground) {
      const basePath = (window.baseUrl || '/').replace(/\/?$/, '/');
      const imageURL = new URL(
        `${basePath}images/2026TechMap_tutorial/ch1_preview.png`,
        window.location.origin
      ).href;
      hero.style.backgroundImage = `linear-gradient(180deg, rgba(0, 0, 0, 0.58), rgba(0, 0, 0, 0.72)), url("${imageURL}")`;
      hero.style.backgroundSize = 'cover';
      hero.style.backgroundPosition = 'center';
      hero.style.backgroundRepeat = 'no-repeat';
      hero.style.width = '100%';
      hero.style.maxWidth = 'none';
      hero.style.marginLeft = '0';
      hero.style.marginRight = '0';
      hero.style.boxSizing = 'border-box';
      hero.style.color = '#fff';
      const copy = hero.querySelector('.copy-container');
      if (copy) {
        copy.style.maxWidth = 'calc(100% - 48px)';
        copy.style.marginLeft = 'auto';
        copy.style.marginRight = 'auto';
      }
      hero.dataset.cloudBackground = 'true';
    }

    if (title.querySelector('br')) return;
    title.replaceChildren(
      document.createTextNode(firstLine),
      document.createElement('br'),
      document.createTextNode(secondLine)
    );
  };
  const addFinalVideo = () => {
    const overview = document.querySelector('.tutorials-overview');
    if (!overview || overview.querySelector('#overthecloud-final-video')) return;
    const chapters = overview.querySelectorAll('.chapter');
    const lastChapter = chapters[chapters.length - 1];
    if (!lastChapter || !lastChapter.textContent.includes(isEnglish ? 'Configure the app entry point' : '앱 진입점 구성하기')) return;

    const basePath = (window.baseUrl || '/').replace(/\/?$/, '/');
    const section = document.createElement('section');
    section.id = 'overthecloud-final-video';
    section.setAttribute('aria-labelledby', 'overthecloud-final-video-title');
    section.style.cssText = 'box-sizing:border-box; margin-top:24px; padding:clamp(20px, 4vw, 48px); border-radius:20px; background:#161616; color:#fff;';

    const heading = document.createElement('h2');
    heading.id = 'overthecloud-final-video-title';
    heading.textContent = isEnglish ? 'Explore the completed app' : '완성된 앱 확인하기';
    heading.style.cssText = 'margin:0 0 16px; font-size:28px; line-height:1.3; color:#fff;';
    const description = document.createElement('p');
    description.textContent = isEnglish ? 'Watch the sky and clouds in the immersive space and see how the app transitions between the window and the space.' : '하늘과 구름으로 채워진 Immersive Space와 공간 이동 동작을 영상으로 확인해 보세요.';
    description.style.cssText = 'margin:0 0 24px; line-height:1.6; color:#fff;';
    const video = document.createElement('video');
    video.controls = true;
    video.playsInline = true;
    video.preload = 'none';
    video.src = `${basePath}videos/2026TechMap_tutorial/finalVideo.mp4`;
    video.poster = `${basePath}images/2026TechMap_tutorial/ch1_preview.png`;
    video.setAttribute('aria-label', isEnglish ? 'A recording of the completed OvertheCloud app' : 'OvertheCloud 최종 완성 앱의 실행 녹화');
    video.style.cssText = 'display:block; width:100%; height:auto; max-height:75vh; object-fit:contain; border-radius:12px; background:#000;';
    section.append(heading, description, video);
    lastChapter.insertAdjacentElement('afterend', section);
  };
  const updateOverview = () => {
    updateLanguageLinks();
    formatTitle();
    addFinalVideo();
  };
  new MutationObserver(updateOverview).observe(document.documentElement, {
    childList: true,
    subtree: true
  });
  window.addEventListener('hashchange', updateLanguageLinks);
  window.addEventListener('popstate', updateLanguageLinks);
  updateOverview();
})();
</script>
